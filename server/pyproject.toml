[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akeno-licensing-server"
dynamic = ["version"]
description = "AKENO licensing server: accounts, activation codes, licenses, devices, signed offline licenses"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.7,<2.8",
    "pyotp>=2.9",
    "segno>=1.6",
    "Jinja2>=3.1.5",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
akeno-server = "akeno_server.cli:main"

[tool.setuptools.dynamic]
version = { attr = "akeno_server.__version__" }

[tool.setuptools.packages.find]
include = ["akeno_server*"]

[tool.setuptools.package-data]
akeno_server = ["web/templates/*.html", "web/templates/*/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

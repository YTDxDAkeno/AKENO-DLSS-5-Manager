name: Production read-only check

# Reads the live AKENO services and compares them with what the Windows build trusts. Nothing is written:
# - GET of health, version, license keys and the website's link pages;
# - every endpoint the app uses, probed WITHOUT credentials and with an empty body (the server answers 401/422
#   before any endpoint code runs);
# - no account, no e-mail, no license, no session is created or changed;
# - the live stable release as an installed AKENO 3.0.0 sees it (tools/live_release_check.py): the release and its
#   downloads are read with the app's own code; on a disposable Windows runner the published 3.0.0 installer is
#   installed and updated from production through the real AKENO.exe files (nothing is sent to the server).
# Runs when this workflow, the acceptance tools or the release records change on a development branch, or by hand.

on:
  push:
    branches: ["claude/**", "codex/**"]
    paths:
      - ".github/workflows/production-check.yml"
      - "tools/account_acceptance.py"
      - "tools/configure-licensing.py"
      - "tools/api_contract.py"
      - "akeno/updater/manifest.py"
      - "akeno/data/*.json"
      - "tools/live_release_check.py"
      - "docs/release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: akeno.online, api.akeno.online (read-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: The build's license verification keys (repository variables, public)
        env:
          LICENSE_SERVER_URL: ${{ vars.AKENO_LICENSE_SERVER_URL }}
          WEBSITE_URL: ${{ vars.AKENO_WEBSITE_URL }}
          LICENSE_PUBLIC_KEYS: ${{ vars.AKENO_LICENSE_PUBLIC_KEYS }}
        run: |
          if [ -n "$LICENSE_PUBLIC_KEYS" ]; then
            python tools/configure-licensing.py --server-url "${LICENSE_SERVER_URL:-https://api.akeno.online}" --website-url="${WEBSITE_URL:-https://akeno.online}" --keys "$LICENSE_PUBLIC_KEYS"
          else
            echo "AKENO_LICENSE_PUBLIC_KEYS is not set: builds use the keys committed in akeno/data/licensing.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "license server variable: ${LICENSE_SERVER_URL:-(not set)}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Account API, website and license keys
        run: |
          set -o pipefail
          {
            echo '### Production read-only check'
            echo '```'
            python tools/account_acceptance.py --api https://api.akeno.online --website https://akeno.online check --license-keys akeno/data/licensing.json
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Production API contract (public OpenAPI document and version, read-only)
        # The Release Manager's real endpoints, if the production API publishes them; nothing is guessed.
        run: |
          set -o pipefail
          {
            echo '### Production API contract'
            echo '```'
            python tools/api_contract.py --api https://api.akeno.online --release-details --schemas --api-version v2 --release-keys akeno/data/release-keys.json
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release channels on AKENO's own server (when configured)
        if: ${{ vars.AKENO_RELEASE_BASE != '' }}
        env:
          RELEASE_BASE: ${{ vars.AKENO_RELEASE_BASE }}
          RELEASE_PUBLIC_KEYS: ${{ vars.AKENO_RELEASE_PUBLIC_KEYS }}
        run: |
          python tools/release_manifest.py embed --keys "$RELEASE_PUBLIC_KEYS" --output release-keys.json
          for channel in stable beta; do
            if curl -fsS --proto '=https' -o "$channel.json" "$RELEASE_BASE/channels/$channel.json"; then
              python tools/release_manifest.py verify "$channel.json" --keys release-keys.json --channel "$channel" --release-base "$RELEASE_BASE" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$channel: no channel manifest published at $RELEASE_BASE/channels/$channel.json" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: What installed AKENO 3.0.0 and 3.1.0 are offered by the live Release Manager (read-only, real downloads)
        # Until 3.1.1 is the live stable release this reports the live release and that 3.1.1 is not published yet.
        run: |
          set -o pipefail
          python tools/live_release_check.py --expect docs/release/3.1.1/release-manager-values.json --download 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  live-upgrade:
    # A disposable Windows runner plays a user's PC with the published 3.0.0: the real installer from akeno.online,
    # checked against its signed SHA-256, keeps the production release key; the update comes from production.
    name: Installed AKENO 3.0.0 and 3.1.0 update themselves from production (disposable Windows runner)
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Install 3.0.0 and 3.1.0, update each to the live stable release, roll back, uninstall
        shell: pwsh
        run: |
          $published = @(
            @{ version = "3.0.0"; sha = "fe919b720e7db4a7e3e8fce97555bb77cde23851d205de3f039d847b1e0dd20f" },
            @{ version = "3.1.0"; sha = "56d33da6c8ad35ed2afffdbb820a9f882231455ef93c759ab02afc04e92b8ca0" })
          $failed = @()
          foreach ($p in $published) {
            Remove-Item "$env:LOCALAPPDATA\AKENO" -Recurse -Force -ErrorAction SilentlyContinue
            $report = "live-upgrade-$($p.version)-report.md"
            python tools/live_release_check.py --expect docs/release/3.1.1/release-manager-values.json --installed $p.version --upgrade-from "https://akeno.online/downloads/$($p.version)/AKENO-Setup.exe" --upgrade-from-sha256 $p.sha --work "$env:RUNNER_TEMP\live-$($p.version)" --report $report
            if ($LASTEXITCODE -ne 0) { $failed += $p.version }
            if (Test-Path $report) {
              "## Installed $($p.version)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          if ($failed) { throw "installed $($failed -join ', ') did not update from production" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-upgrade-report
          path: live-upgrade-*-report.md
          if-no-files-found: ignore

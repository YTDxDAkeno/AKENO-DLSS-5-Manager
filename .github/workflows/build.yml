name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft development prerelease after Linux and Windows pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux, offscreen Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=linux-test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Publish bounded Linux test failure annotations
        if: failure()
        run: python tools/ci_test_annotations.py linux-test-results.xml
      - name: Preserve Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: linux-test-results.xml

  server:
    name: Licensing server (SQLite, PostgreSQL 16, Docker deployment)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akeno
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: akeno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akeno" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-test.txt
      - name: Server tests on SQLite (includes the app's licensing code against a live server)
        working-directory: server
        run: python -m pytest -q --junitxml=../server-sqlite-results.xml
      - name: Server tests on PostgreSQL 16 (redemption races with row locks)
        working-directory: server
        run: python -m pytest -q --junitxml=../server-postgres-results.xml
        env:
          AKENO_TEST_DATABASE_URL: postgresql://akeno:ci-only-password@127.0.0.1:5432/akeno_test
      - name: Deployment with docker compose (install.sh, health, super admin, backup)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's|^AKENO_PUBLIC_URL=$|AKENO_PUBLIC_URL=http://localhost:8411|' .env
          ./install.sh < /dev/null
          docker compose ps
          curl -fsS http://127.0.0.1:8410/api/v1/system/ready
          curl -fsS -o /dev/null http://127.0.0.1:8411/
          curl -fsS -o /dev/null http://127.0.0.1:8412/login
          echo "ci admin password 1" | docker compose exec -T akeno-api akeno-server create-super-admin --email ci@example.invalid --password-stdin
          ./backup.sh
          ls -la backups
          docker compose down -v
      - name: Publish bounded server test failure annotations
        if: failure()
        run: |
          for f in server-sqlite-results.xml server-postgres-results.xml; do
            [ -f "$f" ] && python tools/ci_test_annotations.py "$f" || true
          done
      - name: Preserve server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server-*-results.xml

  real-assets:
    name: Real upstream package contracts (original release archives)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Cache the pinned original release assets
        uses: actions/cache@v4
        with:
          path: real-assets
          key: real-assets-${{ hashFiles('akeno/data/stack/components.json') }}
          restore-keys: real-assets-
      - name: Download every pinned asset and verify it with the production extractor
        run: python tools/validate-stack-catalog.py --download real-assets > real-assets-report.json
      - name: Install the real stacks into fixture game folders
        run: python -m pytest -q tests/test_stack_real_assets.py --junitxml=real-assets-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_REAL_ASSETS_DIR: real-assets
      - name: Preserve the contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-asset-contracts
          path: |
            real-assets-report.json
            real-assets-results.xml

  windows:
    name: Windows build, tests and smoke test
    runs-on: windows-2022
    env:
      # Qt's offscreen plugin does not discover Windows system fonts itself.
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, integration and UI tests
        run: python -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_V14_SCREENSHOTS: screenshots/v14-fixtures
          AKENO_V15_SCREENSHOTS: screenshots/v15-fixtures
          AKENO_V16_SCREENSHOTS: screenshots/v16-fixtures
          AKENO_V2_SCREENSHOTS: screenshots/v2-fixtures
      - name: Publish bounded test failure annotations
        if: failure()
        run: python tools/ci_test_annotations.py test-results.xml
      - name: Verification diagnostics UI at 150 percent (synthetic fixtures)
        run: python -m pytest -q tests/test_v141_ui.py tests/test_v15_ui.py tests/test_v16_ui.py tests/test_stack_ui.py tests/test_assets_layout.py --junitxml=v141-ui-150pct.xml
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
          AKENO_V14_SCREENSHOTS: screenshots/v141-150pct
          AKENO_V15_SCREENSHOTS: screenshots/v15-150pct
          AKENO_V16_SCREENSHOTS: screenshots/v16-150pct
          AKENO_V2_SCREENSHOTS: screenshots/v2-150pct
      - name: Smoke test from source (real Windows hardware/library scan, every page built)
        run: python -m akeno --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: Screenshots of the running app (runner hardware, no NVIDIA GPU)
        run: |
          python -m akeno --screenshot screenshots\windows-runner
          python -m akeno --screenshot screenshots\windows-runner-150pct --screenshot-size 1280x720 --screenshot-scale 1.5
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: FiveM RTX 4080 fixture screenshots (not hardware evidence)
        shell: pwsh
        run: |
          python tools/fivem_fixture.py "$env:RUNNER_TEMP/akeno-fivem-fixture" "$env:RUNNER_TEMP/akeno-fivem-games"
          if ($LASTEXITCODE -ne 0) { throw "FiveM fixture creation failed" }
          $env:AKENO_HOME = "$env:RUNNER_TEMP/akeno-fivem-fixture"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m akeno --screenshot screenshots/fivem-fixture
          if ($LASTEXITCODE -ne 0) { throw "FiveM screenshots failed" }
          python -m akeno --screenshot screenshots/fivem-fixture-150pct --screenshot-size 1280x720 --screenshot-scale 1.5
          if ($LASTEXITCODE -ne 0) { throw "FiveM scaled screenshots failed" }
      - name: Validate private Windows packaging script syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content tools/build-private-offline.ps1 -Raw))
      - name: Build icon
        run: python packaging\make_icon.py
      - name: Checkout reviewed ReShade source and submodule source
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 18deaa52de0c425a78b329e9cb3c497281cd00ec
          path: community-build/ReShade
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build redistributable ReShade with full addon support (64-bit and 32-bit)
        working-directory: community-build/ReShade
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=64-bit /m
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=32-bit /m
      - name: Assemble licensed community dependencies with corresponding source
        run: python tools/build_community_bundle.py --reshade-source community-build/ReShade --reshade-dll community-build/ReShade/bin/x64/Release/ReShade64.dll --reshade32-dll community-build/ReShade/bin/Win32/Release/ReShade32.dll
      - name: Compile pinned Feeder and motion effects
        run: python tools/check_community_shaders.py --compiler community-build/ReShade/bin/x64/Release/fxc.exe --bundle akeno/data/community/dependencies
      - name: Package community dependency release
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force packaging/out | Out-Null
          Compress-Archive -Path akeno/data/community/dependencies/* -DestinationPath "packaging/out/AKENO-community-dependencies-$v-x64.zip"
      - name: Test bundled dependency contracts
        run: python -m pytest -q tests/test_v2_bundle.py
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_TEST_REAL_BUNDLE: '1'
      - name: License server address and public keys (repository variables)
        if: ${{ vars.AKENO_LICENSE_SERVER_URL != '' }}
        env:
          LICENSE_SERVER_URL: ${{ vars.AKENO_LICENSE_SERVER_URL }}
          LICENSE_PUBLIC_KEYS: ${{ vars.AKENO_LICENSE_PUBLIC_KEYS }}
        run: python tools/configure-licensing.py --server-url "$env:LICENSE_SERVER_URL" --keys "$env:LICENSE_PUBLIC_KEYS"
      - name: PyInstaller build
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging\akeno.spec
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\AKENO\AKENO.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged smoke test failed with exit code $($p.ExitCode)" }
          Get-Content "$env:AKENO_HOME\logs\smoke-test.txt"
          "### Packaged AKENO.exe smoke test (runner hardware, no NVIDIA GPU)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content "$env:AKENO_HOME\logs\smoke-test.txt" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Design assets are inside the package
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Recurse -File dist\AKENO -Include *.png,*.svg | Where-Object { $_.FullName -match '\\akeno\\data\\assets\\' }
          $assets | ForEach-Object { $_.FullName.Substring((Resolve-Path dist\AKENO).Path.Length) }
          if (-not ($assets | Where-Object { $_.Name -eq "fivem.svg" })) { throw "FiveM artwork missing from package" }
          if ($assets.Count -lt 19) { throw "expected 19 design assets in the package, found $($assets.Count)" }
      - name: Audit public payload for proprietary NVIDIA runtimes
        run: python tools/check_public_payload.py dist/AKENO
      - name: Packaged GUI starts normally and keeps running
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-gui"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\AKENO\AKENO.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "AKENO.exe exited during normal start (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:AKENO_HOME\logs\akeno.log" -Tail 40
      - name: Public offline inventory (no proprietary binaries)
        shell: pwsh
        run: |
          if (Get-ChildItem runtimes -Recurse -File -Include *.dll,*.bin,*.zip,*.exe) { throw "Proprietary/runtime inputs are forbidden in public CI" }
          Copy-Item runtimes dist\AKENO\runtimes -Recurse
      - name: Portable ZIP
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "AKENO_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force packaging\out | Out-Null
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE dist\AKENO\
          Compress-Archive -Path dist\AKENO\* -DestinationPath "packaging\out\AKENO-DLSS5-Manager-$v-portable-x64.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:AKENO_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem packaging\out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $lines | Set-Content -Path packaging\out\SHA256SUMS.txt -Encoding ascii
          Get-Content packaging\out\SHA256SUMS.txt
          "### SHA-256 of the build artifacts" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content packaging\out\SHA256SUMS.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: AKENO-DLSS5-Manager-windows-x64
          path: packaging/out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results-and-screenshots
          path: |
            test-results.xml
            v141-ui-150pct.xml
            screenshots/v141-150pct/*.png
            screenshots/v14-fixtures/*.png
            screenshots/v15-fixtures/*.png
            screenshots/v15-150pct/*.png
            screenshots/v2-fixtures/*.png
            screenshots/v2-150pct/*.png
            screenshots/v16-fixtures/*.png
            screenshots/v16-150pct/*.png
            screenshots/windows-runner/*.png
            screenshots/windows-runner-150pct/*.png
            screenshots/fivem-fixture/*.png
            screenshots/fivem-fixture-150pct/*.png
            ${{ runner.temp }}/akeno-gui/logs/*
            ${{ runner.temp }}/akeno-smoke/logs/*
            ${{ runner.temp }}/akeno-exe/logs/*

  development-release:
    name: Draft development release from tested Windows artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: [test-linux, server, real-assets, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AKENO-DLSS5-Manager-windows-x64
          path: release-inputs
      - name: Create draft prerelease with exact tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' akeno/__init__.py)
          gh release create "v$v-dev" --draft --prerelease --target "$GITHUB_SHA" --title "AKENO DLSS 5 Manager $v development" --notes-file docs/AKENO_V2_RELEASE_NOTES.md release-inputs/*

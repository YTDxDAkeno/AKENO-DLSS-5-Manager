name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft development prerelease (in this private repository) after Linux and Windows pass
        type: boolean
        default: false
      publish_channel:
        description: Publish the tested build to the public release repository (none, stable or beta)
        type: choice
        options: [none, stable, beta]
        default: none

permissions:
  contents: read

# One run per branch at a time: a running build always finishes; a newer push only replaces a run that is still
# waiting. Tags, pull requests and manual (publishing) runs have their own groups and are never cancelled.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test-linux:
    name: Tests (Linux, offscreen Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxrandr2 libxext6 libdrm2
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=linux-test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Publish bounded Linux test failure annotations
        if: failure()
        run: python tools/ci_test_annotations.py linux-test-results.xml
      - name: Preserve Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: linux-test-results.xml

  server:
    name: Licensing server (SQLite, PostgreSQL 16, Docker deployment)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akeno
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: akeno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akeno" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-test.txt
      - name: Server tests on SQLite (includes the app's licensing code against a live server)
        working-directory: server
        run: python -m pytest -q --junitxml=../server-sqlite-results.xml
      - name: Server tests on PostgreSQL 16 (redemption races with row locks)
        working-directory: server
        run: python -m pytest -q --junitxml=../server-postgres-results.xml
        env:
          AKENO_TEST_DATABASE_URL: postgresql://akeno:ci-only-password@127.0.0.1:5432/akeno_test
      - name: Deployment with docker compose (install.sh, health, super admin, backup)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's|^AKENO_PUBLIC_URL=$|AKENO_PUBLIC_URL=http://localhost:8411|' .env
          ./install.sh < /dev/null
          docker compose ps
          curl -fsS http://127.0.0.1:8410/api/v1/system/ready
          curl -fsS -o /dev/null http://127.0.0.1:8411/
          curl -fsS -o /dev/null http://127.0.0.1:8412/login
          echo "ci admin password 1" | docker compose exec -T akeno-api akeno-server create-super-admin --email ci@example.invalid --password-stdin
          ./backup.sh
          ls -la backups
          docker compose down -v
      - name: License server bundle for the VPS (server/ and deploy/ only, with SHA-256)
        run: deploy/bundle.sh
      - name: Preserve the license server bundle (download it, then ./push-to-vps.sh user@vps dir bundle)
        uses: actions/upload-artifact@v4
        with:
          name: akeno-licensing-server-bundle
          path: dist/akeno-licensing-*
          if-no-files-found: error
      - name: Publish bounded server test failure annotations
        if: failure()
        run: |
          for f in server-sqlite-results.xml server-postgres-results.xml; do
            [ -f "$f" ] && python tools/ci_test_annotations.py "$f" || true
          done
      - name: Preserve server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server-*-results.xml

  real-assets:
    name: Real upstream package contracts (original release archives)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Cache the pinned original release assets
        uses: actions/cache@v4
        with:
          path: real-assets
          key: real-assets-${{ hashFiles('akeno/data/stack/components.json') }}
          restore-keys: real-assets-
      - name: Download every pinned asset and verify it with the production extractor
        run: python tools/validate-stack-catalog.py --download real-assets > real-assets-report.json
      - name: Install the real stacks into fixture game folders
        run: python -m pytest -q tests/test_stack_real_assets.py --junitxml=real-assets-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_REAL_ASSETS_DIR: real-assets
      - name: Preserve the contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-asset-contracts
          path: |
            real-assets-report.json
            real-assets-results.xml

  windows:
    name: Windows build, tests and smoke test
    runs-on: windows-2022
    env:
      # Qt's offscreen plugin does not discover Windows system fonts itself.
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, integration and UI tests
        run: python -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_V14_SCREENSHOTS: screenshots/v14-fixtures
          AKENO_V15_SCREENSHOTS: screenshots/v15-fixtures
          AKENO_V16_SCREENSHOTS: screenshots/v16-fixtures
          AKENO_V2_SCREENSHOTS: screenshots/v2-fixtures
          AKENO_UPDATE_SCREENSHOTS: screenshots/updates-fixtures
      - name: Publish bounded test failure annotations
        if: failure()
        run: python tools/ci_test_annotations.py test-results.xml
      - name: Verification diagnostics UI at 150 percent (synthetic fixtures)
        run: python -m pytest -q tests/test_v141_ui.py tests/test_v15_ui.py tests/test_v16_ui.py tests/test_stack_ui.py tests/test_assets_layout.py --junitxml=v141-ui-150pct.xml
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
          AKENO_V14_SCREENSHOTS: screenshots/v141-150pct
          AKENO_V15_SCREENSHOTS: screenshots/v15-150pct
          AKENO_V16_SCREENSHOTS: screenshots/v16-150pct
          AKENO_V2_SCREENSHOTS: screenshots/v2-150pct
      - name: Smoke test from source (real Windows hardware/library scan, every page built)
        run: python -m akeno --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: AKENO 3.1 system tools against the real runner (read-only Windows providers)
        shell: pwsh
        run: |
          python tools/system_check.py --json system-check.json --eicar | Tee-Object -Variable out
          $code = $LASTEXITCODE
          "### AKENO 3.1 system tools on the Windows runner (read-only)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "the system tools raised a Python error on Windows" }
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: AKENO 3.1 SYSTEM pages with stand-in providers (TEST DATA, not hardware evidence)
        run: |
          python tools/system_fixtures.py screenshots/system-fixtures --lang en
          python tools/system_fixtures.py screenshots/system-fixtures --lang de
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Screenshots of the running app (runner hardware, no NVIDIA GPU)
        run: |
          python -m akeno --screenshot screenshots\windows-runner
          python -m akeno --screenshot screenshots\windows-runner-150pct --screenshot-size 1280x720 --screenshot-scale 1.5
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: FiveM RTX 4080 fixture screenshots (not hardware evidence)
        shell: pwsh
        run: |
          python tools/fivem_fixture.py "$env:RUNNER_TEMP/akeno-fivem-fixture" "$env:RUNNER_TEMP/akeno-fivem-games"
          if ($LASTEXITCODE -ne 0) { throw "FiveM fixture creation failed" }
          $env:AKENO_HOME = "$env:RUNNER_TEMP/akeno-fivem-fixture"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m akeno --screenshot screenshots/fivem-fixture
          if ($LASTEXITCODE -ne 0) { throw "FiveM screenshots failed" }
          python -m akeno --screenshot screenshots/fivem-fixture-150pct --screenshot-size 1280x720 --screenshot-scale 1.5
          if ($LASTEXITCODE -ne 0) { throw "FiveM scaled screenshots failed" }
      - name: Validate private Windows packaging script syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content tools/build-private-offline.ps1 -Raw))
      - name: Build icon
        run: python packaging\make_icon.py
      - name: Checkout reviewed ReShade source and submodule source
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 18deaa52de0c425a78b329e9cb3c497281cd00ec
          path: community-build/ReShade
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build redistributable ReShade with full addon support (64-bit and 32-bit)
        working-directory: community-build/ReShade
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=64-bit /m
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=32-bit /m
      - name: Assemble licensed community dependencies with corresponding source
        run: python tools/build_community_bundle.py --reshade-source community-build/ReShade --reshade-dll community-build/ReShade/bin/x64/Release/ReShade64.dll --reshade32-dll community-build/ReShade/bin/Win32/Release/ReShade32.dll
      - name: Compile pinned Feeder and motion effects
        run: python tools/check_community_shaders.py --compiler community-build/ReShade/bin/x64/Release/fxc.exe --bundle akeno/data/community/dependencies
      - name: Package community dependency release
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force packaging/out | Out-Null
          Compress-Archive -Path akeno/data/community/dependencies/* -DestinationPath "packaging/out/AKENO-community-dependencies-$v-x64.zip"
      - name: Test bundled dependency contracts
        run: python -m pytest -q tests/test_v2_bundle.py
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_TEST_REAL_BUNDLE: '1'
      - name: License server address and public keys (repository variables)
        # Every build: unset variables keep the committed values (official addresses, committed public keys).
        shell: pwsh
        env:
          LICENSE_SERVER_URL: ${{ vars.AKENO_LICENSE_SERVER_URL }}
          WEBSITE_URL: ${{ vars.AKENO_WEBSITE_URL }}
          LICENSE_PUBLIC_KEYS: ${{ vars.AKENO_LICENSE_PUBLIC_KEYS }}
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_channel == 'stable' || inputs.publish_channel == 'beta' }}
        run: |
          $require = @(); if ($env:RELEASE_BUILD -eq 'true') { $require = @('--require') }
          $server = if ($env:LICENSE_SERVER_URL) { $env:LICENSE_SERVER_URL } else { 'https://api.akeno.online' }
          $website = if ($env:WEBSITE_URL) { $env:WEBSITE_URL } else { 'https://akeno.online' }
          python tools/configure-licensing.py --server-url "$server" --website-url="$website" --keys="$env:LICENSE_PUBLIC_KEYS" @require
          if ($LASTEXITCODE -ne 0) { throw "license configuration failed" }
      - name: Release verification key and public release repository (repository variables)
        shell: pwsh
        env:
          RELEASE_PUBLIC_KEYS: ${{ vars.AKENO_RELEASE_PUBLIC_KEYS }}
          RELEASE_REPO: ${{ vars.AKENO_RELEASE_REPO }}
          UPDATE_SOURCE: ${{ vars.AKENO_UPDATE_SOURCE }}
          RELEASE_BASE: ${{ vars.AKENO_RELEASE_BASE }}
          RELEASE_API: ${{ vars.AKENO_RELEASE_API }}
          RELEASE_PAGE: ${{ vars.AKENO_RELEASE_PAGE }}
          DOWNLOAD_HOSTS: ${{ vars.AKENO_DOWNLOAD_HOSTS }}
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_channel == 'stable' || inputs.publish_channel == 'beta' }}
        run: |
          # Unset: the committed public release key stays (akeno/data/release-keys.json). Only public keys here;
          # the signing key is a secret used by publish-release alone and never reaches the build.
          if ($env:RELEASE_PUBLIC_KEYS) {
            python tools/release_manifest.py embed --keys "$env:RELEASE_PUBLIC_KEYS" --require
            if ($LASTEXITCODE -ne 0) { throw "release key configuration failed" }
          }
          # Default: the AKENO Release Manager on the production API (GET /api/v1/releases/stable).
          # AKENO_UPDATE_SOURCE=akeno: static signed channel files; =github: the GitHub release repository.
          if ($env:UPDATE_SOURCE -eq 'akeno') {
            python tools/release_manifest.py distribution --source akeno --repo="$env:RELEASE_REPO" --release-base="$env:RELEASE_BASE" --release-page="$env:RELEASE_PAGE" --download-hosts="$env:DOWNLOAD_HOSTS"
          } elseif ($env:UPDATE_SOURCE -eq 'github') {
            python tools/release_manifest.py distribution --repo="$env:RELEASE_REPO"
          } else {
            $api = if ($env:RELEASE_API) { $env:RELEASE_API } else { 'https://api.akeno.online/api/v1' }
            $page = if ($env:RELEASE_PAGE) { $env:RELEASE_PAGE } else { 'https://akeno.online/downloads/latest' }
            $hosts = if ($env:DOWNLOAD_HOSTS) { $env:DOWNLOAD_HOSTS } else { 'akeno.online' }
            python tools/release_manifest.py distribution --source akeno-api --repo="$env:RELEASE_REPO" --release-api="$api" --release-page="$page" --download-hosts="$hosts"
          }
          if ($LASTEXITCODE -ne 0) { throw "release source configuration failed" }
      - name: PyInstaller build
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging\akeno.spec
      - name: Packaged build trusts the official API and the public license and release keys
        shell: pwsh
        env:
          LICENSE_SERVER_URL: ${{ vars.AKENO_LICENSE_SERVER_URL }}
          WEBSITE_URL: ${{ vars.AKENO_WEBSITE_URL }}
          AKENO_RELEASE_SIGNING_KEY: ${{ secrets.AKENO_RELEASE_SIGNING_KEY }}
        run: |
          $server = if ($env:LICENSE_SERVER_URL) { $env:LICENSE_SERVER_URL } else { 'https://api.akeno.online' }
          $website = if ($env:WEBSITE_URL) { $env:WEBSITE_URL } else { 'https://akeno.online' }
          python tools/check_build_config.py dist\AKENO --server "$server" --website "$website" | Tee-Object -Variable out
          $code = $LASTEXITCODE
          "### Build configuration (public values)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "build configuration check failed" }
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\AKENO\AKENO.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged smoke test failed with exit code $($p.ExitCode)" }
          Get-Content "$env:AKENO_HOME\logs\smoke-test.txt"
          "### Packaged AKENO.exe smoke test (runner hardware, no NVIDIA GPU)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content "$env:AKENO_HOME\logs\smoke-test.txt" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Design assets are inside the package
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Recurse -File dist\AKENO -Include *.png,*.svg | Where-Object { $_.FullName -match '\\akeno\\data\\assets\\' }
          $assets | ForEach-Object { $_.FullName.Substring((Resolve-Path dist\AKENO).Path.Length) }
          if (-not ($assets | Where-Object { $_.Name -eq "fivem.svg" })) { throw "FiveM artwork missing from package" }
          if ($assets.Count -lt 19) { throw "expected 19 design assets in the package, found $($assets.Count)" }
      - name: Audit public payload for proprietary NVIDIA runtimes
        run: python tools/check_public_payload.py dist/AKENO
      - name: Desktop Studio on the runner desktop (packaged wallpaper renderers, picture and web)
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-desktop"
          python tools/desktop_check.py --exe dist\AKENO\AKENO.exe --out screenshots\desktop-studio
      - name: Packaged GUI starts normally and keeps running
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-gui"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\AKENO\AKENO.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "AKENO.exe exited during normal start (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:AKENO_HOME\logs\akeno.log" -Tail 40
      - name: Packaged network helper through the runas verb (read-only, no adapter or tunnel)
        shell: pwsh
        run: |
          python tools/packaged_helper_check.py dist\AKENO\AKENO.exe packaged-helper-report.json
          if ($LASTEXITCODE -ne 0) { throw "packaged network helper check failed" }
      - name: Public offline inventory (no proprietary binaries)
        shell: pwsh
        run: |
          if (Get-ChildItem runtimes -Recurse -File -Include *.dll,*.bin,*.zip,*.exe) { throw "Proprietary/runtime inputs are forbidden in public CI" }
          Copy-Item runtimes dist\AKENO\runtimes -Recurse
      - name: Portable ZIP
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "AKENO_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force packaging\out | Out-Null
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE dist\AKENO\
          Compress-Archive -Path dist\AKENO\* -DestinationPath "packaging\out\AKENO-Gaming-Suite-$v-portable-x64.zip"
      - name: Portable ZIP (the updater's package) carries the same configuration
        shell: pwsh
        env:
          LICENSE_SERVER_URL: ${{ vars.AKENO_LICENSE_SERVER_URL }}
          WEBSITE_URL: ${{ vars.AKENO_WEBSITE_URL }}
          AKENO_RELEASE_SIGNING_KEY: ${{ secrets.AKENO_RELEASE_SIGNING_KEY }}
        run: |
          $server = if ($env:LICENSE_SERVER_URL) { $env:LICENSE_SERVER_URL } else { 'https://api.akeno.online' }
          $website = if ($env:WEBSITE_URL) { $env:WEBSITE_URL } else { 'https://akeno.online' }
          python tools/check_build_config.py "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-portable-x64.zip" --server "$server" --website "$website"
          if ($LASTEXITCODE -ne 0) { throw "portable ZIP configuration check failed" }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:AKENO_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Release Manager values of the built files (accepted by the updater's own unpacking rules)
        shell: pwsh
        run: |
          $zip = "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-portable-x64.zip"
          $exe = "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-Setup-x64.exe"
          python tools/release_v2.py describe $zip $exe | Tee-Object -Variable described
          if ($LASTEXITCODE -ne 0) { throw "the portable ZIP is not what the Release Manager and the updater accept" }
          "### Release Manager values (file_count, uncompressed size, content_sha256)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $described | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Corresponding source code (GPL-3.0-or-later) of this exact commit
        shell: pwsh
        run: |
          git archive --format=zip --prefix="AKENO-Gaming-Suite-$env:AKENO_VERSION-source/" -o "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem packaging\out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $lines | Set-Content -Path packaging\out\SHA256SUMS.txt -Encoding ascii
          Get-Content packaging\out\SHA256SUMS.txt
          "### SHA-256 of the build artifacts" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content packaging\out\SHA256SUMS.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: AKENO-Gaming-Suite-windows-x64
          path: packaging/out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results-and-screenshots
          path: |
            test-results.xml
            v141-ui-150pct.xml
            system-check.json
            packaged-helper-report.json
            screenshots/system-fixtures/*.png
            screenshots/v141-150pct/*.png
            screenshots/v14-fixtures/*.png
            screenshots/v15-fixtures/*.png
            screenshots/v15-150pct/*.png
            screenshots/v2-fixtures/*.png
            screenshots/v2-150pct/*.png
            screenshots/v16-fixtures/*.png
            screenshots/v16-150pct/*.png
            screenshots/windows-runner/*.png
            screenshots/windows-runner-150pct/*.png
            screenshots/desktop-studio/*
            screenshots/fivem-fixture/*.png
            screenshots/fivem-fixture-150pct/*.png
            screenshots/updates-fixtures/*.png
            ${{ runner.temp }}/akeno-gui/logs/*
            ${{ runner.temp }}/akeno-smoke/logs/*
            ${{ runner.temp }}/akeno-exe/logs/*
      - name: Release summary (checksums, Release Manager values, real Windows security check)
        shell: pwsh
        run: |
          "=== SHA256SUMS ==="
          Get-Content packaging\out\SHA256SUMS.txt -ErrorAction SilentlyContinue
          "=== Release Manager values ==="
          python tools/release_v2.py describe "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-portable-x64.zip" "packaging\out\AKENO-Gaming-Suite-$env:AKENO_VERSION-Setup-x64.exe"
          "=== System tools on this runner ==="
          python tools/system_check.py --print-summary system-check.json

  windows-update-e2e:
    # A disposable Windows runner: installs the tested installer, then updates, breaks, interrupts and rolls back
    # that installation through the real packaged AKENO.exe files against a local test Release Manager
    # (tools/update_e2e.py). The test key replaces the release key in that test installation only.
    name: Windows update end to end (installer, updater, health check, rollback, recovery)
    needs: [windows]
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build the next version of this commit (patch number + 1, for the update test only)
        shell: pwsh
        run: |
          python packaging\make_icon.py
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $p = $v.Split('.'); $next = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          (Get-Content akeno\__init__.py) -replace '__version__ = ".+"', "__version__ = `"$next`"" | Set-Content akeno\__init__.py
          pyinstaller --noconfirm --distpath dist-next --workpath build-next packaging\akeno.spec
          if ($LASTEXITCODE -ne 0) { throw "next version build failed" }
          git checkout -- akeno/__init__.py
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE dist-next\AKENO\
      - uses: actions/download-artifact@v4
        with:
          name: AKENO-Gaming-Suite-windows-x64
          path: rc
      - name: Update end to end on this runner
        shell: pwsh
        run: |
          $setup = Get-ChildItem rc -Filter '*-Setup-x64.exe' | Select-Object -First 1
          python tools/update_e2e.py --installer $setup.FullName --next dist-next\AKENO --work "$env:RUNNER_TEMP\e2e" --report e2e-report.md
          $code = $LASTEXITCODE
          if (Test-Path e2e-report.md) { Get-Content e2e-report.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Copy-Item "$env:LOCALAPPDATA\AKENO\updates\*.log", "$env:LOCALAPPDATA\AKENO\updates\*.json" e2e-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\AKENO\logs\*" e2e-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\e2e\setup.log" e2e-logs -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "update end-to-end test failed" }
      - name: Upgrade paths from the published releases to this build (real 3.0.0, 3.1.0 and 3.1.1 installers)
        # The installers users have: downloaded read-only from the production download and checked against the
        # SHA-256 their signed releases carry (3.0.0: sequence 1, 3.1.0: sequence 2, 3.1.1: sequence 3 = live
        # stable, key d6139235b220a4aa; read by the production read-only check on 2026-10-28). Then
        # the same scenarios as above update that installation to this commit's portable package.
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $zip = Get-ChildItem rc -Filter '*-portable-x64.zip' | Select-Object -First 1
          New-Item -ItemType Directory -Force published, next-build | Out-Null
          Expand-Archive $zip.FullName -DestinationPath next-build -Force
          $published = @(
            @{ version = "3.0.0"; sha = "fe919b720e7db4a7e3e8fce97555bb77cde23851d205de3f039d847b1e0dd20f" },
            @{ version = "3.1.0"; sha = "56d33da6c8ad35ed2afffdbb820a9f882231455ef93c759ab02afc04e92b8ca0" },
            @{ version = "3.1.1"; sha = "138e8958754755b8dd3611f07e864d371bb3f4aea2ecae8114b33d57f885f9c1" })
          $failed = @()
          foreach ($p in $published) {
            if ($v -eq $p.version) { continue }
            # a user's PC with that version: no update state from the tests before (anti-replay would rightly
            # refuse anything older than what they have seen)
            Remove-Item "$env:LOCALAPPDATA\AKENO" -Recurse -Force -ErrorAction SilentlyContinue
            $setup = "published\AKENO-Setup-$($p.version).exe"
            Invoke-WebRequest "https://akeno.online/downloads/$($p.version)/AKENO-Setup.exe" -OutFile $setup
            $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $p.sha) { throw "the downloaded $($p.version) installer is not the signed one ($sha)" }
            $report = "e2e-upgrade-$($p.version)-report.md"
            python tools/update_e2e.py --installer $setup --installed-version $p.version --next next-build --next-version $v --work "$env:RUNNER_TEMP\e2e-upgrade-$($p.version)" --report $report
            if ($LASTEXITCODE -ne 0) { $failed += $p.version }
            if (Test-Path $report) {
              "## Upgrade $($p.version) -> $v" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $report | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          if ($failed) { throw "upgrade from $($failed -join ', ') failed" }
      - name: Repair of a 3.1.0 that no longer starts (installer over it, saved Hardware Health report)
        # 3.1.0 ends while building its pages once Hardware Health has saved a report (CPU temperature not
        # available). That installation can only be repaired from outside: the new installer over it, with the
        # user's data, saved results and undo records kept.
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($v -eq "3.1.0") { "this build is 3.1.0 itself"; exit 0 }
          Remove-Item "$env:LOCALAPPDATA\AKENO" -Recurse -Force -ErrorAction SilentlyContinue
          $setup = Get-ChildItem rc -Filter '*-Setup-x64.exe' | Select-Object -First 1
          python tools/repair_e2e.py --broken-installer published\AKENO-Setup-3.1.0.exe --installer $setup.FullName --work "$env:RUNNER_TEMP\repair" --report repair-report.md
          $code = $LASTEXITCODE
          if (Test-Path repair-report.md) {
            Get-Content repair-report.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($code -ne 0) { throw "the repair of a 3.1.0 that no longer starts failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-e2e
          path: |
            e2e-report.md
            e2e-logs/*
            e2e-upgrade-*-report.md
            repair-report.md

  publish-release:
    # Users download from the PUBLIC release repository (no GitHub login); this repository stays private.
    # Needs: variable AKENO_RELEASE_REPO (owner/name), secrets AKENO_RELEASE_SIGNING_KEY (Ed25519 seed from
    # tools/release_manifest.py keygen) and AKENO_RELEASE_REPO_TOKEN (fine-grained token: contents read/write on
    # the release repository only). None of them ever reaches the Windows build.
    name: Publish to the public release repository
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_channel != 'none')
    needs: [test-linux, server, real-assets, windows, windows-update-e2e]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_REPO: ${{ vars.AKENO_RELEASE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: Version, tag and channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.publish_channel }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' akeno/__init__.py)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match __version__ $v"; exit 1
          fi
          channel="${INPUT_CHANNEL:-}"
          if [[ -z "$channel" || "$channel" == "none" ]]; then
            if [[ "$v" == *-* ]]; then channel=beta; else channel=stable; fi
          fi
          test -n "$RELEASE_REPO" || { echo "::error::repository variable AKENO_RELEASE_REPO is not set"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: AKENO-Gaming-Suite-windows-x64
          path: dist-public
      - name: Corresponding source code (GPL-3.0-or-later) and checksums
        shell: bash
        run: |
          git archive --format=zip --prefix="AKENO-Gaming-Suite-$VERSION-source/" \
            -o "dist-public/AKENO-Gaming-Suite-$VERSION-source.zip" HEAD
          rm -f dist-public/SHA256SUMS.txt
          (cd dist-public && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Signed release manifest
        shell: bash
        env:
          AKENO_RELEASE_SIGNING_KEY: ${{ secrets.AKENO_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$AKENO_RELEASE_SIGNING_KEY" || { echo "::error::secret AKENO_RELEASE_SIGNING_KEY is not set"; exit 1; }
          python tools/release_manifest.py sign --channel "$CHANNEL" --release "$VERSION" --tag "v$VERSION" \
            --repo "$RELEASE_REPO" --out "public/channels/$CHANNEL.json" dist-public/*
      - name: Publish the release and update the channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AKENO_RELEASE_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::secret AKENO_RELEASE_REPO_TOKEN is not set"; exit 1; }
          pre=""; [[ "$CHANNEL" == beta ]] && pre="--prerelease"
          gh release create "v$VERSION" --repo "$RELEASE_REPO" $pre --title "AKENO Gaming Suite $VERSION" \
            --notes-file docs/RELEASE_NOTES.md dist-public/*
          gh auth setup-git
          git clone --depth 1 "https://github.com/$RELEASE_REPO.git" release-repo
          git -C release-repo checkout -B main           # also works for a new, empty release repository
          mkdir -p release-repo/channels release-repo/compatibility release-repo/community
          cp -n distribution/release-repo/README.md release-repo/ || true
          cp -n distribution/release-repo/channels/README.md release-repo/channels/ || true
          cp -n distribution/release-repo/community/index.json release-repo/community/ || true
          cp "public/channels/$CHANNEL.json" release-repo/channels/
          cp akeno/data/compatibility.json release-repo/compatibility/compatibility.json
          cd release-repo
          git config user.name "AKENO release"
          git config user.email "akeno-release@users.noreply.github.com"
          git add -A .
          git commit -m "AKENO Gaming Suite $VERSION ($CHANNEL)"
          git push -u origin main

  development-release:
    name: Draft development release from tested Windows artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: [test-linux, server, real-assets, windows, windows-update-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AKENO-Gaming-Suite-windows-x64
          path: release-inputs
      - name: Create draft prerelease with exact tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' akeno/__init__.py)
          gh release create "v$v-dev" --draft --prerelease --target "$GITHUB_SHA" --title "AKENO Gaming Suite $v development" --notes-file docs/AKENO_V3_RELEASE_NOTES.md release-inputs/*

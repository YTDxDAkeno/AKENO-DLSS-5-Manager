name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux, offscreen Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows build, tests and smoke test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, integration and UI tests
        run: python -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Smoke test from source (real Windows hardware/library scan, every page built)
        run: python -m akeno --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: Screenshots of the running app (runner hardware, no NVIDIA GPU)
        run: python -m akeno --screenshot screenshots\windows-runner
        env:
          QT_QPA_PLATFORM: offscreen
          AKENO_HOME: ${{ runner.temp }}\akeno-smoke
      - name: Build icon
        run: python packaging\make_icon.py
      - name: PyInstaller build
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging\akeno.spec
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $env:AKENO_HOME = "$env:RUNNER_TEMP\akeno-exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\AKENO\AKENO.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged smoke test failed with exit code $($p.ExitCode)" }
          Get-Content "$env:AKENO_HOME\logs\smoke-test.txt"
      - name: Portable ZIP
        shell: pwsh
        run: |
          $v = (Select-String -Path akeno\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "AKENO_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force packaging\out | Out-Null
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE dist\AKENO\
          Compress-Archive -Path dist\AKENO\* -DestinationPath "packaging\out\AKENO-DLSS5-Manager-$v-portable-x64.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:AKENO_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem packaging\out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $lines | Set-Content -Path packaging\out\SHA256SUMS.txt -Encoding ascii
          Get-Content packaging\out\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AKENO-DLSS5-Manager-windows-x64
          path: packaging/out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results-and-screenshots
          path: |
            test-results.xml
            screenshots/windows-runner/*.png
            ${{ runner.temp }}/akeno-smoke/logs/*
            ${{ runner.temp }}/akeno-exe/logs/*
